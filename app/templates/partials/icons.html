{# 원본 시안에서 쓰인 인라인 SVG 아이콘 모음.
   외부 아이콘 폰트/이미지 없이 stroke=currentColor 로 색을 상속받는다. #}

{% macro icon(name, size=17, stroke=1.7) -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="{{ stroke }}" aria-hidden="true" focusable="false">
{%- if name == 'grid' %}
  <rect x="3" y="3" width="7" height="8"></rect><rect x="14" y="3" width="7" height="5"></rect>
  <rect x="14" y="11" width="7" height="10"></rect><rect x="3" y="14" width="7" height="7"></rect>
{%- elif name == 'doc' %}
  <path d="M6 3h9l5 5v13H6z"></path><path d="M15 3v5h5M9 13h7M9 17h5"></path>
{%- elif name == 'chart' %}
  <path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path>
{%- elif name == 'calendar' %}
  <rect x="3" y="5" width="18" height="16"></rect><path d="M3 10h18M8 3v4M16 3v4"></path>
{%- elif name == 'inbox' %}
  <path d="M3 7h18v13H3z"></path><path d="M3 7l4-4h10l4 4M8 12l3 3 5-5"></path>
{%- elif name == 'user' %}
  <circle cx="12" cy="8" r="3.4"></circle><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"></path>
{%- elif name == 'menu' %}
  <path d="M4 6h16M4 12h16M4 18h16"></path>
{%- elif name == 'bell' %}
  <path d="M18 8a6 6 0 10-12 0c0 7-3 8-3 8h18s-3-1-3-8M13.7 21a2 2 0 01-3.4 0"></path>
{%- elif name == 'chevron-down' %}
  <path d="M6 9l6 6 6-6"></path>
{%- elif name == 'logout' %}
  <path d="M9 21H5V3h4M16 17l5-5-5-5M21 12H9"></path>
{%- elif name == 'close' %}
  <path d="M18 6L6 18M6 6l12 12"></path>
{%- elif name == 'search' %}
  <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path>
{%- elif name == 'plus' %}
  <path d="M12 5v14M5 12h14"></path>
{%- elif name == 'check' %}
  <path d="M20 6L9 17l-5-5"></path>
{%- elif name == 'trash' %}
  <path d="M4 7h16M10 11v6M14 11v6M5 7l1 13h12l1-13M9 7V4h6v3"></path>
{%- endif %}
</svg>
{%- endmacro %}
